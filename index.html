<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Back Order Command Center</title><style>
:root{--navy:#071a33;--blue:#1769e0;--ink:#14213d;--muted:#64748b;--line:#d8e2ef;--ok:#16865b;--bad:#c93140;--shadow:0 14px 34px rgba(18,47,84,.14)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#dcefff,transparent 32%),#f3f7fc;color:var(--ink);font:14px/1.45 Segoe UI,Arial}.shell{max-width:1780px;margin:auto;padding:18px}.hero{padding:26px 28px;border-radius:23px;color:white;background:linear-gradient(135deg,#06182f,#0c4f95 62%,#1b9be0);box-shadow:0 22px 48px rgba(7,26,51,.23)}.hero-row{display:flex;justify-content:space-between;align-items:center;gap:16px}.hero h1{margin:0;font-size:34px}.hero p{margin:5px 0 0;color:#d8ecff}.updated{padding:10px 14px;border:1px solid #ffffff44;border-radius:12px;background:#ffffff16}.panel{margin-top:14px;background:#ffffffdf;border:1px solid #fff;border-radius:20px;box-shadow:var(--shadow)}.filters{display:grid;grid-template-columns:minmax(240px,1.4fr) minmax(220px,1.2fr) minmax(170px,.7fr) auto auto;gap:12px;padding:15px;align-items:end}.field{position:relative}.field label{display:block;margin-bottom:5px;font-weight:750}.control,select,.btn{height:45px;width:100%;padding:0 13px;border:1px solid #c5d4e4;border-radius:12px;background:#fff;font:inherit}.control:focus,select:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 4px #1769e01c}.btn{width:auto;padding:0 18px;font-weight:750;cursor:pointer}.primary{color:#fff;border:0;background:linear-gradient(135deg,#1769e0,#124ba4)}.suggestions{display:none;position:static;margin-top:8px;max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:13px;background:#fff;padding:6px;box-shadow:0 10px 22px #12305418}.suggestions.show{display:block}.suggestion{padding:10px 12px;border-radius:9px;cursor:pointer}.suggestion:hover,.suggestion.active{background:#eaf3ff;color:#0b55bd}.kpis{display:grid;grid-template-columns:repeat(8,minmax(125px,1fr));gap:11px;margin-top:14px}.kpi{padding:15px;border-radius:17px;background:linear-gradient(145deg,#fff,#edf3fa);border:1px solid #fff;box-shadow:0 8px 18px #122f541e;border-left:5px solid var(--blue)}.kpi.good{border-left-color:var(--ok)}.kpi.bad{border-left-color:var(--bad)}.kpi span{color:var(--muted);font-weight:700}.kpi b{display:block;margin-top:6px;font-size:21px}.table-panel{padding:14px}.table-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.table-head h2{margin:0}.count{color:var(--muted)}.tablewrap{overflow:auto;max-height:68vh;border:1px solid var(--line);border-radius:13px;background:#fff}table{width:100%;min-width:1500px;border-collapse:separate;border-spacing:0}th,td{padding:9px 10px;border-right:1px solid #e6edf5;border-bottom:1px solid #e6edf5;vertical-align:top;text-align:left;white-space:nowrap}th{position:sticky;top:0;z-index:2;color:#fff;background:linear-gradient(#173b68,#0b294c);cursor:pointer}.num{text-align:right}.tag{display:inline-block;padding:4px 9px;border-radius:999px;font-weight:750;font-size:12px}.tag.ok{color:#087447;background:#dcf5e9}.tag.bad{color:#a91d2b;background:#ffe1e4}.order-parts{display:grid;gap:7px;min-width:420px}.part-line{padding:9px 10px;border:1px solid #dce7f2;border-radius:10px;background:#f5f9fd;white-space:normal}.part-no{font-weight:800;color:#0b55bd;margin-right:7px}.part-desc{display:block;margin-top:4px;color:#526071}.part-meta{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px;font-size:12px}.order-party{font-weight:800;color:#0b4d9a}.order-number{font-weight:800;color:#173b68}.empty{text-align:center;padding:40px!important}.foot{text-align:center;color:var(--muted);padding:12px;font-size:12px}
@media(max-width:1050px){.filters{grid-template-columns:1fr 1fr}.kpis{grid-template-columns:repeat(4,1fr)}}
@media(max-width:700px){body{font-size:13px}.shell{padding:8px}.hero{padding:18px 16px}.hero-row{display:block}.hero h1{font-size:23px}.updated{margin-top:12px}.filters{grid-template-columns:1fr;padding:12px}.control,select,.btn{height:48px;font-size:16px}.btn{width:100%}.suggestion{padding:13px 11px;font-size:15px}.kpis{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px}.kpi{flex:0 0 72%;min-width:220px;scroll-snap-align:start}.table-panel{padding:9px}.table-head>div:last-child{display:none}.tablewrap{overflow:visible;max-height:none;border:0;background:transparent}table{display:block;min-width:0}thead{display:none}tbody{display:grid;gap:12px}tbody tr{display:block;border:1px solid #dce6f1;border-radius:16px;background:#fff;overflow:hidden;box-shadow:0 8px 19px #122f5417}td{display:block;position:relative;white-space:normal;overflow-wrap:anywhere;padding:10px 12px 10px 43%;min-height:43px;border-right:0}td:before{content:attr(data-label);position:absolute;left:12px;top:10px;width:36%;font-size:11px;font-weight:800;color:#64748b;text-transform:uppercase;letter-spacing:.3px}.order-party{background:#eff6ff}.order-parts{min-width:0;gap:9px}.part-line{padding:10px}.part-meta{font-size:12px}.parts-cell{padding:11px!important}.parts-cell:before{position:static;display:block;width:auto;margin-bottom:8px}.empty{padding:30px 10px!important}.empty:before{display:none}}
@media(max-width:390px){.kpi{flex-basis:84%}td{padding-left:42%}}
</style></head><body><div class="shell"><header class="hero"><div class="hero-row"><div><h1>Back Order Command Center</h1><p>AlignBooks pending-order, credit and ageing intelligence</p></div><div class="updated" id="updated"></div></div></header><section class="panel filters"><div class="field"><label>Search Party</label><input id="partySearch" class="control" autocomplete="off" placeholder="Type party name"><div id="suggestions" class="suggestions"></div></div><div class="field"><label>Search Salesman</label><input id="salesmanSearch" class="control" autocomplete="off" placeholder="Type salesman name"><div id="salesmanSuggestions" class="suggestions"></div></div><div class="field"><label>Condition</label><select id="condition"><option>All</option><option>Succeed</option><option>Stock Full</option><option>Under Credit Limit</option><option>Over 60 Days</option><option>Stock Short</option><option>Over Credit Limit</option></select></div><button id="clear" class="btn">Clear</button><button id="export" class="btn primary">Export Filtered CSV</button></section><section id="kpis" class="kpis"></section><section class="panel table-panel"><div class="table-head"><div><h2>Pending Back Orders</h2><div id="count" class="count"></div></div><div class="count">Click heading to sort</div></div><div class="tablewrap"><table><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table></div></section><div class="foot">One card or row per Sales Order. Backend source reports remain unchanged.</div></div><script src="data.js"></script><script>
const D=window.BACKORDER_DATA||{records:[]};const $=id=>document.getElementById(id),updated=$('updated'),head=$('head'),body=$('body'),kpis=$('kpis'),count=$('count'),partySearch=$('partySearch'),suggestions=$('suggestions'),salesmanSearch=$('salesmanSearch'),salesmanSuggestions=$('salesmanSuggestions'),condition=$('condition'),clear=$('clear'),exportBtn=$('export');const esc=v=>String(v??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])),fmt=n=>new Intl.NumberFormat('en-IN',{maximumFractionDigits:2}).format(+n||0),money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(+n||0);
const cols=[['date','Date'],['orderNo','Sales Order'],['party','Party'],['parts','Parts'],['pendingQty','Total Pending Qty'],['stockStatus','Stock Status'],['creditStatus','Credit Status'],['ageingDays','Ageing Days'],['ageingStatus','Status'],['pendingAmount','Pending Amount'],['branch','Branch'],['salesman','Salesman']];
function groupOrders(records){const map=new Map();for(const r of records){const k=(r.orderNo||'')+'||'+(r.party||'');if(!map.has(k))map.set(k,{date:r.date,orderNo:r.orderNo,party:r.party,branch:r.branch,salesman:r.salesman,creditStatus:r.creditStatus,ageingDays:+r.ageingDays||0,ageingStatus:r.ageingStatus,pendingQty:0,pendingAmount:0,parts:[],success:true,stockStatus:'Stock Full'});const g=map.get(k);g.pendingQty+=+r.pendingQty||0;g.pendingAmount+=+r.pendingAmount||0;g.ageingDays=Math.max(g.ageingDays,+r.ageingDays||0);g.ageingStatus=g.ageingDays>60?'Over 60 Days':'Within 60 Days';if((+r.stockQty||0)<(+r.pendingQty||0))g.stockStatus=(+r.stockQty||0)>0?'Partial Stock':'No Stock';g.parts.push({partNumber:r.partNumber,description:r.description,pendingQty:+r.pendingQty||0,pendingAmount:+r.pendingAmount||0,stockStatus:r.stockStatus})}for(const g of map.values()){g.stockFull=g.parts.length>0&&g.parts.every(p=>p.stockStatus==='Stock Full');g.stockShort=!g.stockFull;g.underCredit=g.creditStatus==='Under Credit Limit';g.overCredit=!g.underCredit;g.withinAgeing=g.ageingDays<=60;g.overAgeing=!g.withinAgeing;g.success=g.stockFull&&g.underCredit&&g.withinAgeing;g.stockStatus=g.stockFull?'Stock Full':(g.parts.some(p=>p.stockStatus==='Partial Stock')?'Partial Stock':'No Stock')}return [...map.values()]}
const orders=groupOrders(D.records||[]),parties=[...new Set(orders.map(x=>x.party).filter(Boolean))].sort((a,b)=>a.localeCompare(b)),salesmen=[...new Set(orders.map(x=>x.salesman).filter(Boolean))].sort((a,b)=>a.localeCompare(b));let view=[],sort={k:'date',d:-1},active=-1;updated.innerHTML=`<b>Last Updated</b><br>${esc(D.updatedAt||'Not available')}`;head.innerHTML=cols.map(([k,t])=>`<th data-k="${k}">${t}</th>`).join('');
function partsHtml(parts){return `<div class="order-parts">${parts.map((p,i)=>`<div class="part-line"><span class="part-no">Part ${i+1}</span><b>${esc(p.partNumber)}</b><span class="part-desc">${esc(p.description)}</span><span class="part-meta"><span>Pending Qty: <b>${fmt(p.pendingQty)}</b></span><span>Amount: <b>${money(p.pendingAmount)}</b></span><span class="tag ${p.stockStatus==='Stock Full'?'ok':'bad'}">${esc(p.stockStatus)}</span></span></div>`).join('')}</div>`}function td(label,value,cls=''){return `<td data-label="${esc(label)}" class="${cls}">${value}</td>`}
function filter(){const q=partySearch.value.trim().toLowerCase(),sq=salesmanSearch.value.trim().toLowerCase(),c=condition.value;view=orders.filter(r=>(!q||String(r.party||'').toLowerCase().includes(q))&&(!sq||String(r.salesman||'').toLowerCase().includes(sq))&&(c==='All'||c==='Succeed'&&r.success||c==='Stock Full'&&r.stockFull||c==='Under Credit Limit'&&r.underCredit||c==='Over 60 Days'&&r.overAgeing||c==='Stock Short'&&r.stockShort||c==='Over Credit Limit'&&r.overCredit));render()}
function render(){view.sort((a,b)=>{let x=sort.k==='parts'?a.parts.length:a[sort.k],y=sort.k==='parts'?b.parts.length:b[sort.k];return (typeof x==='number'?x-y:String(x??'').localeCompare(String(y??'')))*sort.d});const partyCount=new Set(view.map(x=>x.party)).size,totalParts=view.reduce((s,x)=>s+x.parts.length,0),pending=view.reduce((s,x)=>s+x.pendingQty,0),full=view.filter(x=>x.stockFull).length,old=view.filter(x=>x.overAgeing).length,success=view.filter(x=>x.success).length;const cards=[['Pending Orders',view.length],['Sales Orders',view.length],['Parts',totalParts],['Pending Quantity',fmt(pending)],['Parties',partyCount],['Stock Full Orders',full,'good'],['Over 60 Days',old,old?'bad':'good'],['Succeed Orders',success,'good']];kpis.innerHTML=cards.map(x=>`<div class="kpi ${x[2]||''}"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('');count.textContent=`Showing ${view.length} sales orders from ${totalParts} part lines`;body.innerHTML=view.length?view.map(r=>`<tr>${td('Date',esc(r.date))}${td('Sales Order',esc(r.orderNo),'order-number')}${td('Party',esc(r.party),'order-party')}${td('Parts',partsHtml(r.parts),'parts-cell')}${td('Total Pending Qty',fmt(r.pendingQty),'num')}${td('Stock Status',`<span class="tag ${r.stockStatus==='Stock Full'?'ok':'bad'}">${esc(r.stockStatus)}</span>`)}${td('Credit Status',`<span class="tag ${r.creditStatus==='Under Credit Limit'?'ok':'bad'}">${esc(r.creditStatus)}</span>`)}${td('Ageing Days',fmt(r.ageingDays),'num')}${td('Status',`<span class="tag ${r.ageingDays<=60?'ok':'bad'}">${esc(r.ageingStatus)}</span>`)}${td('Pending Amount',money(r.pendingAmount),'num')}${td('Branch',esc(r.branch))}${td('Salesman',esc(r.salesman))}</tr>`).join(''):`<tr><td colspan="12" class="empty">No matching sales orders</td></tr>`}
function showSuggestions(){const q=partySearch.value.trim().toLowerCase();if(!q){suggestions.classList.remove('show');return}const m=parties.filter(p=>p.toLowerCase().includes(q)).slice(0,12);active=-1;suggestions.innerHTML=m.length?`<div style="padding:5px 10px;color:#64748b;font-size:11px;font-weight:800">MATCHING PARTIES</div>`+m.map((p,i)=>`<div class="suggestion" data-i="${i}">${esc(p)}</div>`).join(''):'';suggestions.classList.toggle('show',m.length>0)}function showSalesmanSuggestions(){const q=salesmanSearch.value.trim().toLowerCase();if(!q){salesmanSuggestions.classList.remove('show');return}const m=salesmen.filter(n=>n.toLowerCase().includes(q)).slice(0,12);salesmanSuggestions.innerHTML=m.length?`<div style="padding:5px 10px;color:#64748b;font-size:11px;font-weight:800">MATCHING SALESMEN</div>`+m.map(n=>`<div class="suggestion">${esc(n)}</div>`).join(''):'';salesmanSuggestions.classList.toggle('show',m.length>0)}salesmanSearch.addEventListener('input',()=>{showSalesmanSuggestions();filter()});salesmanSuggestions.addEventListener('mousedown',e=>{const item=e.target.closest('.suggestion');if(item){salesmanSearch.value=item.textContent;salesmanSuggestions.classList.remove('show');filter()}});partySearch.addEventListener('input',()=>{showSuggestions();filter()});partySearch.addEventListener('keydown',e=>{const items=[...suggestions.querySelectorAll('.suggestion')];if(e.key==='ArrowDown'){e.preventDefault();active=Math.min(active+1,items.length-1)}else if(e.key==='ArrowUp'){e.preventDefault();active=Math.max(active-1,0)}else if(e.key==='Enter'&&active>=0){partySearch.value=items[active].textContent;suggestions.classList.remove('show');filter()}items.forEach((x,i)=>x.classList.toggle('active',i===active))});suggestions.addEventListener('mousedown',e=>{const x=e.target.closest('.suggestion');if(x){partySearch.value=x.textContent;suggestions.classList.remove('show');filter()}});document.addEventListener('click',e=>{if(!e.target.closest('.field')){suggestions.classList.remove('show');salesmanSuggestions.classList.remove('show')}});condition.onchange=filter;clear.onclick=()=>{partySearch.value='';salesmanSearch.value='';condition.value='All';suggestions.classList.remove('show');salesmanSuggestions.classList.remove('show');filter()};document.querySelectorAll('th').forEach(h=>h.onclick=()=>{const k=h.dataset.k;sort={k,d:sort.k===k?-sort.d:1};render()});exportBtn.onclick=()=>{const rows=[['Date','Sales Order','Party','Part Number','Description','Pending Quantity','Stock Status','Credit Status','Ageing Days','Status','Pending Amount','Branch','Salesman'],...view.flatMap(r=>r.parts.map(p=>[r.date,r.orderNo,r.party,p.partNumber,p.description,p.pendingQty,p.stockStatus,r.creditStatus,r.ageingDays,r.ageingStatus,p.pendingAmount,r.branch,r.salesman]))],csv=rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download='Back_Order_Filtered.csv';a.click()};filter();
</script></body></html>
