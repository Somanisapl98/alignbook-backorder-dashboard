<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Back Order Command Center</title>
<style>
:root{--navy:#071a33;--blue:#1769e0;--cyan:#49b8ff;--ink:#14213d;--muted:#64748b;--line:#d8e2ef;--glass:rgba(255,255,255,.82);--ok:#16865b;--bad:#d13f4b;--warn:#b77700;--shadow:0 18px 45px rgba(18,47,84,.15);--shadow2:0 8px 18px rgba(18,47,84,.12)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font:14px/1.45 "Segoe UI",Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 8% 0%,#d9efff 0,transparent 32%),radial-gradient(circle at 92% 12%,#e8e1ff 0,transparent 28%),#f4f7fb;min-height:100vh}.shell{max-width:1780px;margin:auto;padding:20px}.hero{position:relative;overflow:hidden;padding:28px 30px;border-radius:24px;color:#fff;background:linear-gradient(135deg,#06182f,#0b4385 58%,#168bd2);box-shadow:0 24px 55px rgba(7,26,51,.26);transform:perspective(1200px) rotateX(.1deg)}.hero:after{content:"";position:absolute;width:380px;height:380px;border-radius:50%;right:-90px;top:-190px;background:linear-gradient(135deg,rgba(255,255,255,.22),transparent);animation:float 9s ease-in-out infinite}.hero-row{position:relative;z-index:1;display:flex;justify-content:space-between;gap:20px;align-items:center}.hero h1{margin:0;font-size:clamp(25px,3vw,40px);letter-spacing:-.7px}.hero p{margin:7px 0 0;color:#d7ebff}.updated{text-align:right;border:1px solid rgba(255,255,255,.24);background:rgba(255,255,255,.1);backdrop-filter:blur(10px);padding:12px 16px;border-radius:14px}.panel{background:var(--glass);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.9);border-radius:20px;box-shadow:var(--shadow);margin-top:16px}.filters{display:grid;grid-template-columns:minmax(280px,2fr) minmax(180px,.8fr) auto auto;gap:12px;padding:16px;align-items:end}.field{position:relative}.field label{display:block;margin:0 0 6px;font-weight:700;color:#334155}.control,select,.btn{height:44px;width:100%;border:1px solid #c6d5e5;border-radius:12px;background:#fff;padding:0 13px;color:var(--ink);outline:none;transition:.2s}.control:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(23,105,224,.12)}.btn{width:auto;font-weight:750;cursor:pointer;padding:0 18px;box-shadow:var(--shadow2)}.btn:hover{transform:translateY(-2px)}.primary{border:0;color:#fff;background:linear-gradient(135deg,var(--blue),#124ba4)}.suggestions{display:none;position:absolute;top:72px;left:0;right:0;max-height:280px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 40px rgba(15,43,76,.22);z-index:30;padding:6px}.suggestions.show{display:block;animation:pop .16s ease-out}.suggestion{padding:10px 12px;border-radius:9px;cursor:pointer}.suggestion:hover,.suggestion.active{background:#eaf3ff;color:#0b55bd}.kpis{display:grid;grid-template-columns:repeat(8,minmax(130px,1fr));gap:12px;margin-top:16px}.kpi{position:relative;overflow:hidden;padding:16px;border-radius:18px;background:linear-gradient(145deg,#fff,#edf3fa);border:1px solid #fff;box-shadow:var(--shadow2);transition:.25s;animation:rise .45s both}.kpi:hover{transform:translateY(-5px) rotateX(2deg);box-shadow:0 18px 30px rgba(18,47,84,.18)}.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(var(--cyan),var(--blue))}.kpi span{color:var(--muted);font-weight:650}.kpi b{display:block;font-size:22px;margin-top:7px;letter-spacing:-.3px}.kpi.good:before{background:var(--ok)}.kpi.bad:before{background:var(--bad)}.table-panel{padding:16px;margin-top:16px}.table-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}.table-head h2{margin:0;font-size:20px}.count{color:var(--muted)}.tablewrap{overflow:auto;max-height:68vh;border:1px solid var(--line);border-radius:14px;background:#fff}table{width:100%;min-width:1450px;border-collapse:separate;border-spacing:0}th,td{padding:10px 11px;border-right:1px solid #e6edf5;border-bottom:1px solid #e6edf5;white-space:nowrap;text-align:left}th{position:sticky;top:0;z-index:3;color:#fff;background:linear-gradient(180deg,#173b68,#0b294c);cursor:pointer;font-size:13px}tbody tr{transition:.16s}tbody tr:hover td{background:#eef6ff;transform:translateZ(1px)}tbody tr:nth-child(even) td{background:#fafcff}.num{text-align:right}.tag{display:inline-block;padding:4px 9px;border-radius:999px;font-size:12px;font-weight:750}.tag.ok{background:#dcf5e9;color:#087447}.tag.bad{background:#ffe1e4;color:#a91d2b}.empty{text-align:center;padding:45px!important;color:var(--muted)}.foot{padding:14px 4px;color:var(--muted);text-align:center}@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@keyframes pop{from{opacity:0;transform:translateY(-5px) scale(.98)}to{opacity:1;transform:none}}@keyframes float{50%{transform:translate(-20px,30px) scale(1.06)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media(max-width:1100px){.kpis{grid-template-columns:repeat(4,1fr)}.filters{grid-template-columns:1fr 1fr}.hero-row{align-items:flex-start}}@media(max-width:650px){.shell{padding:9px}.hero{padding:20px}.hero-row{display:block}.updated{text-align:left;margin-top:15px}.filters,.kpis{grid-template-columns:1fr}.btn{width:100%}}
</style></head>
<body><div class="shell"><header class="hero"><div class="hero-row"><div><h1>Back Order Command Center</h1><p>AlignBooks pending-order, credit and ageing intelligence</p></div><div class="updated" id="updated"></div></div></header>
<section class="panel filters"><div class="field"><label>Search Party</label><input class="control" id="partySearch" autocomplete="off" placeholder="Type A, a, or any party name"><div class="suggestions" id="suggestions"></div></div><div class="field"><label>Condition</label><select id="condition"><option>All</option><option>Succeed</option><option>Stock Full</option><option>Under Credit Limit</option><option>Over 60 Days</option><option>Stock Short</option><option>Over Credit Limit</option></select></div><button class="btn" id="clear">Clear</button><button class="btn primary" id="export">Export Filtered CSV</button></section>
<section class="kpis" id="kpis"></section>
<section class="panel table-panel"><div class="table-head"><div><h2>Pending Back Orders</h2><div class="count" id="count"></div></div><div class="count">Click a heading to sort</div></div><div class="tablewrap"><table><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table></div></section><div class="foot">Backend reports remain available locally in Input and Archive. Source tabs are intentionally hidden from this dashboard.</div></div>
<script src="data.js"></script><script>
const D=window.BACKORDER_DATA||{records:[]};
const money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(+n||0),fmt=n=>new Intl.NumberFormat('en-IN',{maximumFractionDigits:2}).format(+n||0),esc=v=>String(v??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
// Stock Quantity is intentionally excluded from the visible table.
const cols=[['date','Date'],['orderNo','Sales Order'],['party','Party'],['partNumber','Part Number'],['description','Description'],['pendingQty','Pending Quantity'],['remainingCredit','Remaining Credit'],['stockStatus','Stock Status'],['creditStatus','Credit Status'],['ageingDays','Ageing Days'],['ageingStatus','Status'],['outstanding','Outstanding'],['pendingAmount','Pending Amount'],['branch','Branch'],['salesman','Salesman']];
let view=[],sort={k:'date',d:-1},activeSuggestion=-1;const parties=[...new Set((D.records||[]).map(r=>r.party).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
updated.innerHTML=`<b>Last Updated</b><br>${esc(D.updatedAt||'Not available')}`;head.innerHTML=cols.map(([k,t])=>`<th data-k="${k}">${t}</th>`).join('');
function filter(){let q=partySearch.value.trim().toLowerCase(),c=condition.value;view=(D.records||[]).filter(r=>{if(q&&!String(r.party).toLowerCase().includes(q))return false;if(c==='Succeed')return r.success;if(c==='Stock Full')return r.stockQty>=r.pendingQty;if(c==='Under Credit Limit')return r.remainingCredit>=0;if(c==='Over 60 Days')return r.ageingDays>60;if(c==='Stock Short')return r.stockQty<r.pendingQty;if(c==='Over Credit Limit')return r.remainingCredit<0;return true});render()}
function render(){view.sort((a,b)=>((typeof a[sort.k]==='number'?a[sort.k]-b[sort.k]:String(a[sort.k]??'').localeCompare(String(b[sort.k]??'')))*sort.d));let ps=[...new Set(view.map(r=>r.party))],pending=view.reduce((s,r)=>s+r.pendingQty,0),rem=ps.reduce((s,p)=>s+(view.find(r=>r.party===p)?.remainingCredit||0),0),out=ps.reduce((s,p)=>s+(view.find(r=>r.party===p)?.outstanding||0),0),full=view.filter(r=>r.stockQty>=r.pendingQty).length,over60=view.filter(r=>r.ageingDays>60).length,success=view.filter(r=>r.success).length;let cards=[['Lines',view.length],['Pending Quantity',fmt(pending)],['Parties',ps.length],['Remaining Credit',money(rem)],['Outstanding',money(out)],['Stock Full Lines',full,'good'],['Over 60 Days',over60,over60?'bad':'good'],['Succeed Lines',success,'good']];kpis.innerHTML=cards.map((x,i)=>`<div class="kpi ${x[2]||''}" style="animation-delay:${i*35}ms"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('');count.textContent=`Showing ${view.length} of ${(D.records||[]).length} lines`;body.innerHTML=view.length?view.map(r=>`<tr>${cols.map(([k])=>{let v=r[k],cls=['pendingQty','remainingCredit','ageingDays','outstanding','pendingAmount'].includes(k)?'num':'';if(['stockStatus','creditStatus','ageingStatus'].includes(k)){let ok=k==='stockStatus'?r.stockQty>=r.pendingQty:k==='creditStatus'?r.remainingCredit>=0:r.ageingDays<=60;return `<td><span class="tag ${ok?'ok':'bad'}">${esc(v)}</span></td>`}return `<td class="${cls}">${['remainingCredit','outstanding','pendingAmount'].includes(k)?money(v):['pendingQty','ageingDays'].includes(k)?fmt(v):esc(v)}</td>`}).join('')}</tr>`).join(''):`<tr><td colspan="${cols.length}" class="empty">No matching pending orders</td></tr>`}
function showSuggestions(){let q=partySearch.value.trim().toLowerCase();if(!q){suggestions.classList.remove('show');return}let matches=parties.filter(p=>p.toLowerCase().includes(q)).slice(0,12);activeSuggestion=-1;suggestions.innerHTML=matches.map((p,i)=>`<div class="suggestion" data-i="${i}">${esc(p)}</div>`).join('');suggestions.classList.toggle('show',matches.length>0)}
partySearch.addEventListener('input',()=>{showSuggestions();filter()});partySearch.addEventListener('keydown',e=>{let items=[...suggestions.querySelectorAll('.suggestion')];if(e.key==='ArrowDown'){e.preventDefault();activeSuggestion=Math.min(activeSuggestion+1,items.length-1)}else if(e.key==='ArrowUp'){e.preventDefault();activeSuggestion=Math.max(activeSuggestion-1,0)}else if(e.key==='Enter'&&activeSuggestion>=0){e.preventDefault();partySearch.value=items[activeSuggestion].textContent;suggestions.classList.remove('show');filter()}else if(e.key==='Escape')suggestions.classList.remove('show');items.forEach((x,i)=>x.classList.toggle('active',i===activeSuggestion))});suggestions.addEventListener('mousedown',e=>{let item=e.target.closest('.suggestion');if(!item)return;partySearch.value=item.textContent;suggestions.classList.remove('show');filter()});document.addEventListener('click',e=>{if(!e.target.closest('.field'))suggestions.classList.remove('show')});condition.onchange=filter;clear.onclick=()=>{partySearch.value='';condition.value='All';suggestions.classList.remove('show');filter()};document.querySelectorAll('th').forEach(th=>th.onclick=()=>{let k=th.dataset.k;sort={k,d:sort.k===k?-sort.d:1};render()});export.onclick=()=>{let rows=[cols.map(x=>x[1]),...view.map(r=>cols.map(x=>r[x[0]]))],csv=rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download='Back_Order_Filtered.csv';a.click()};filter();
</script></body></html>
