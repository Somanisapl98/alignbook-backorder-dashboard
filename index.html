<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Back Order Dashboard</title><style>
:root{--blue:#4472c4;--dark:#203864;--header:#5b9bd5;--grid:#d9e1f2;--soft:#eaf2f8;--green:#70ad47;--red:#c00000;--yellow:#ffc000}*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#222;font:14px Calibri,Arial,sans-serif}.app{max-width:1900px;margin:auto;background:#fff;min-height:100vh}.title{background:var(--dark);color:#fff;text-align:center;font-size:28px;font-weight:700;padding:14px}.tabs{display:flex;overflow:auto;background:#ddebf7;border-bottom:1px solid #9fbad0;position:sticky;top:0;z-index:10}.tab{width:auto;min-width:170px;border:0;border-right:1px solid #9fbad0;border-radius:0;padding:12px 18px;background:#ddebf7;font-weight:700;cursor:pointer}.tab.active{background:#fff;color:var(--dark);border-top:4px solid var(--blue);padding-top:8px}.panel{display:none;padding:14px}.panel.active{display:block}.filterbar{display:grid;grid-template-columns:130px minmax(260px,1fr) 110px minmax(180px,.5fr) auto auto;gap:8px;align-items:center;margin-bottom:10px}.filterbar label{font-weight:700}.filterbar input,.filterbar select,.sheet-tools input,.sheet-tools select{padding:8px;border:1px solid #8ea9c1;border-radius:2px;width:100%}.note{color:#666;font-style:italic}.btn{padding:8px 14px;border:1px solid #8ea9c1;background:#fff;font-weight:700;cursor:pointer}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.kpis{display:grid;grid-template-columns:repeat(9,1fr);border:1px solid #8ea9c1;margin-bottom:10px}.kpi{border-right:1px solid #8ea9c1;text-align:center}.kpi:last-child{border-right:0}.kpi .label{background:var(--header);color:#fff;font-weight:700;padding:8px 4px;min-height:34px}.kpi .value{font-size:19px;font-weight:700;padding:10px 4px;background:#fff}.kpi.good .value{background:#e2f0d9;color:#375623}.kpi.bad .value{background:#f4cccc;color:#9c0006}.tablewrap{border:1px solid #8ea9c1;overflow:auto;max-height:70vh}table{border-collapse:separate;border-spacing:0;width:100%;min-width:1500px}th,td{padding:7px 8px;border-right:1px solid #d6dce4;border-bottom:1px solid #d6dce4;white-space:nowrap;text-align:left}th{position:sticky;top:0;background:var(--dark);color:#fff;z-index:2;cursor:pointer}tbody tr:nth-child(even) td{background:#f7f9fc}.num{text-align:right}.status{font-weight:700}.goodtxt{color:#548235}.badtxt{color:#c00000}.sheet-tools{display:grid;grid-template-columns:minmax(220px,2fr) minmax(180px,1fr) minmax(160px,1fr) auto;gap:8px;margin-bottom:10px}.sheet-title{font-size:21px;color:var(--dark);font-weight:700;margin-bottom:10px}.sheet-count{margin:6px 0;color:#5b6573}.rawtable{min-width:max-content}.rawtable th{background:var(--header)}.empty{text-align:center;padding:40px!important}.updated{text-align:right;color:#475569;padding:8px 14px 0}.footer{padding:12px 14px;color:#64748b}@media(max-width:1000px){.filterbar,.sheet-tools{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}.kpi{border-bottom:1px solid #8ea9c1}.title{text-align:left;font-size:22px}}
</style></head><body><div class="app"><div class="title">Back Order Dashboard</div><div class="updated" id="updated"></div><nav class="tabs" id="tabs"></nav><main><section class="panel active" id="dashboard"></section><section class="panel" id="sheetpanel"></section></main><div class="footer">Source: <span id="source"></span></div></div><script src="data.js"></script><script>
const D=window.BACKORDER_DATA||{records:[],sheets:[]};const money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(+n||0),fmt=n=>new Intl.NumberFormat('en-IN',{maximumFractionDigits:2}).format(+n||0),esc=v=>String(v??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
document.querySelector('#updated').innerHTML=`Last Updated: <b>${esc(D.updatedAt||'')}</b>`;document.querySelector('#source').textContent=D.sourceFile||'';
const tabDefs=[['dashboard','Back Order Dashboard'],...(D.sheets||[]).map((s,i)=>['sheet'+i,s.name])];const tabs=document.querySelector('#tabs');tabs.innerHTML=tabDefs.map((t,i)=>`<button class="tab ${i?'':'active'}" data-id="${t[0]}">${esc(t[1])}</button>`).join('');tabs.onclick=e=>{let b=e.target.closest('.tab');if(!b)return;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));if(b.dataset.id==='dashboard'){document.querySelector('#dashboard').classList.add('active');document.querySelector('#sheetpanel').classList.remove('active')}else{document.querySelector('#dashboard').classList.remove('active');document.querySelector('#sheetpanel').classList.add('active');showSheet(+b.dataset.id.replace('sheet',''))}};
const cols=[['date','Date'],['orderNo','Sales Order'],['party','Party'],['partNumber','Part Number'],['description','Description'],['pendingQty','Pending Quantity'],['stockQty','Stock Quantity'],['remainingCredit','Remaining Credit'],['stockStatus','Stock Status'],['creditStatus','Credit Status'],['ageingDays','Ageing Days'],['ageingStatus','Status'],['outstanding','Bill Amount']];let dsort={k:'date',d:-1},view=[];
document.querySelector('#dashboard').innerHTML=`<div class="filterbar"><label>Search Party</label><input id="dq" placeholder="Blank party = all"><span class="note">Blank party = all.</span><label>Condition</label><select id="dc"><option>All</option><option>Succeed</option><option>Stock Full</option><option>Under Credit Limit</option><option>Over 60 Days</option><option>Stock Short</option><option>Over Credit Limit</option></select><button class="btn" id="dclear">Clear</button><button class="btn primary" id="dexport">Export</button></div><div class="kpis" id="kpis"></div><div class="tablewrap"><table><thead><tr>${cols.map(([k,t])=>`<th data-k="${k}">${t}</th>`).join('')}</tr></thead><tbody id="dbody"></tbody></table></div>`;
function dfilt(){let q=document.querySelector('#dq').value.trim().toLowerCase(),c=document.querySelector('#dc').value;view=D.records.filter(r=>{if(q&&!r.party.toLowerCase().includes(q))return false;if(c==='Succeed')return r.stockQty>=r.pendingQty&&r.remainingCredit>=0&&r.ageingDays<=60;if(c==='Stock Full')return r.stockQty>=r.pendingQty;if(c==='Under Credit Limit')return r.remainingCredit>=0;if(c==='Over 60 Days')return r.ageingDays>60;if(c==='Stock Short')return r.stockQty<r.pendingQty;if(c==='Over Credit Limit')return r.remainingCredit<0;return true});drender()}
function drender(){view.sort((a,b)=>((typeof a[dsort.k]==='number'?a[dsort.k]-b[dsort.k]:String(a[dsort.k]).localeCompare(String(b[dsort.k]))))*dsort.d);let parties=[...new Set(view.map(r=>r.party))],pq=view.reduce((s,r)=>s+r.pendingQty,0),rem=parties.reduce((s,p)=>s+(view.find(r=>r.party===p)?.remainingCredit||0),0),out=parties.reduce((s,p)=>s+(view.find(r=>r.party===p)?.outstanding||0),0),under=view.some(r=>r.remainingCredit>0),over60=view.some(r=>r.ageingDays>60),success=view.some(r=>r.stockQty>=r.pendingQty&&r.remainingCredit>=0&&r.ageingDays<=60),full=view.some(r=>r.stockQty>=r.pendingQty);let ks=[['Lines',view.length],['Pending Quantity',fmt(pq)],['Parties',parties.length],['Remaining Credit',money(rem)],['Outstanding',money(out)],['Under Credit Limit',under?'Yes':'No',under],['Over 60 Days',over60?'Yes':'No',!over60],['Succeed',success?'Yes':'No',success],['Stock Full',full?'Yes':'No',full]];document.querySelector('#kpis').innerHTML=ks.map(k=>`<div class="kpi ${k.length>2?(k[2]?'good':'bad'):''}"><div class="label">${k[0]}</div><div class="value">${k[1]}</div></div>`).join('');document.querySelector('#dbody').innerHTML=view.length?view.map(r=>`<tr>${cols.map(([k])=>{let v=r[k],cl=['pendingQty','stockQty','remainingCredit','ageingDays','outstanding'].includes(k)?'num':'';if(['stockStatus','creditStatus','ageingStatus'].includes(k))cl+=' status '+((k==='stockStatus'?r.stockQty>=r.pendingQty:k==='creditStatus'?r.remainingCredit>=0:r.ageingDays<=60)?'goodtxt':'badtxt');return `<td class="${cl}">${['remainingCredit','outstanding'].includes(k)?money(v):['pendingQty','stockQty','ageingDays'].includes(k)?fmt(v):esc(v)}</td>`}).join('')}</tr>`).join(''):`<tr><td colspan="13" class="empty">No matching pending orders</td></tr>`}
document.querySelector('#dq').oninput=dfilt;document.querySelector('#dc').onchange=dfilt;document.querySelector('#dclear').onclick=()=>{dq.value='';dc.value='All';dfilt()};document.querySelectorAll('#dashboard th').forEach(th=>th.onclick=()=>{let k=th.dataset.k;dsort={k,d:dsort.k===k?-dsort.d:1};drender()});document.querySelector('#dexport').onclick=()=>csvExport('Back_Order_Filtered.csv',[cols.map(x=>x[1]),...view.map(r=>cols.map(x=>r[x[0]]))]);
let rawState={i:0,rows:[],filtered:[],sort:-1,dir:1};function headerGuess(rows){for(let i=0;i<Math.min(rows.length,30);i++){let filled=rows[i].filter(x=>String(x).trim()).length;if(filled>=3)return i}return 0}function showSheet(i){let s=D.sheets[i],hi=headerGuess(s.rows),headers=s.rows[hi]||[],body=s.rows.slice(hi+1);rawState={i,headers,rows:body,filtered:body,sort:-1,dir:1};document.querySelector('#sheetpanel').innerHTML=`<div class="sheet-title">${esc(s.name)}</div><div class="sheet-tools"><input id="sq" placeholder="Search this entire sheet"><select id="scol"><option value="-1">All columns</option>${headers.map((h,j)=>`<option value="${j}">${esc(h||'Column '+(j+1))}</option>`).join('')}</select><select id="sval"><option value="">All values</option></select><button class="btn primary" id="sexport">Export Filtered CSV</button></div><div class="sheet-count" id="scount"></div><div class="tablewrap"><table class="rawtable"><thead><tr>${headers.map((h,j)=>`<th data-j="${j}">${esc(h||'Column '+(j+1))}</th>`).join('')}</tr></thead><tbody id="sbody"></tbody></table></div>`;sq.oninput=rawFilter;scol.onchange=()=>{fillValues();rawFilter()};sval.onchange=rawFilter;sexport.onclick=()=>csvExport(s.name+'_Filtered.csv',[headers,...rawState.filtered]);document.querySelectorAll('#sheetpanel th').forEach(th=>th.onclick=()=>{let j=+th.dataset.j;rawState.dir=rawState.sort===j?-rawState.dir:1;rawState.sort=j;rawFilter()});fillValues();rawFilter()}
function fillValues(){let j=+scol.value;sval.innerHTML='<option value="">All values</option>';if(j<0)return;[...new Set(rawState.rows.map(r=>r[j]||''))].sort((a,b)=>String(a).localeCompare(String(b))).slice(0,1000).forEach(v=>sval.add(new Option(v||'(Blank)',v)))}function rawFilter(){let q=sq.value.trim().toLowerCase(),j=+scol.value,v=sval.value;rawState.filtered=rawState.rows.filter(r=>(!q||r.join(' ').toLowerCase().includes(q))&&(j<0||!v||String(r[j]||'')===v));if(rawState.sort>=0){let x=rawState.sort,d=rawState.dir;rawState.filtered.sort((a,b)=>{let av=a[x]||'',bv=b[x]||'',an=+String(av).replace(/,/g,''),bn=+String(bv).replace(/,/g,'');return (!isNaN(an)&&!isNaN(bn)?an-bn:String(av).localeCompare(String(bv)))*d})}scount.textContent=`Showing ${rawState.filtered.length} of ${rawState.rows.length} rows`;sbody.innerHTML=rawState.filtered.slice(0,5000).map(r=>`<tr>${rawState.headers.map((_,j)=>`<td>${esc(r[j]||'')}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${rawState.headers.length}" class="empty">No matching rows</td></tr>`}
function csvExport(name,rows){let csv=rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download=name.replace(/[^a-z0-9_.-]+/gi,'_');a.click()}dfilt();
</script></body></html>
